name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test, build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests, build and validation
        run: npm run check

      - name: Upload the add-on
        uses: actions/upload-artifact@v4
        with:
          name: PerfBoost-mcaddon
          path: dist/PerfBoost_v0.1.0.mcaddon
          if-no-files-found: error
