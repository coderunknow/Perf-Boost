name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and attach the add-on
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests, build and validation
        run: npm run check

      # Creates the release for the tag when it does not exist yet, and attaches
      # the verified add-on. Release notes are maintained separately from
      # CHANGELOG.md, so this step never rewrites them.
      - name: Attach the add-on to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.mcaddon
          fail_on_unmatched_files: true
